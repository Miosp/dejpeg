[project]
name = "fbcnn"
version = "0.1.0"
description = "Modern PyTorch port of FBCNN (Flexible Blind JPEG Artifacts Removal, ICCV 2021)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1,<3.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbcnn"]

# CPU-only torch. The port + ONNX conversion pipeline never touches CUDA;
# pulling the CUDA wheel (~2.5GB) would waste CI time and disk for everyone.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",
    "opencv-python>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
