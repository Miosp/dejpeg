[project]
name = "dejpeg-train"
version = "0.1.0"
description = "DeJPEGNet research training pipeline: corpora, degradation synthesis, training phases, eval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    # IQA baseline metrics: PSNR/SSIM via scikit-image, LPIPS-Alex via
    # lpips, PSNR-B ported from FBCNN utils_image. pyiqa (MUSIQ/MANIQA/CLIPIQA/
    # DISTS) DEFERRED to Real-web-500 eval -- its facexlib dep has a broken sdist
    # (get_hash needs .git); revisit via git-clone + wheel build then.
    "scikit-image>=0.22",
    # pkg_resources provider for the clip package (pyiqa/clipiqa); setuptools
    # >=80 removed it and uv sync reinstalls latest, so pin here.
    "setuptools<80",
    "opencv-python-headless>=4.8",
    "lpips>=0.1.4",
    # raw ingest (user raws): rawpy wraps LibRaw for DNG/CR2/NEF -> RGB.
    "rawpy>=0.18",
    "webdataset>=0.2",
    "pillow>=10.0",
    "simplejpeg>=1.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "playwright>=1.40",
    "matplotlib>=3.8",
    # export pipeline: export, simplify, FP16 cast, ORT parity
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxsim>=0.4",
    "onnxconverter-common>=1.14",
    "lion-pytorch>=0.2.5",
    "schedulefree>=1.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dejpeg_train"]

# Standalone project (NOT a root workspace member): the root workspace pins
# CPU-only torch for fbcnn, which never touches CUDA. DeJPEGNet trains on GPU,
# so torch/torchvision come from the cu124 index instead.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
