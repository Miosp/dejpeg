[project]
name = "dejpeg-train"
version = "0.1.0"
description = "DeJPEGNet research training pipeline: corpora, degradation synthesis, training phases, eval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14",
    "torchvision>=0.29",
    # IQA baseline metrics: PSNR/SSIM via scikit-image, LPIPS-Alex via
    # lpips, PSNR-B ported from FBCNN utils_image. pyiqa lives in dev deps
    # (E1 panel: TOPIQ-FR, A-FINE); its facexlib dep resolved fine at
    # >=0.1.16.
    "scikit-image>=0.22",
    # pkg_resources provider for the clip package (pyiqa/clipiqa); setuptools
    # >=80 removed it and uv sync reinstalls latest, so pin here.
    "setuptools<80",
    "opencv-python-headless>=4.8",
    "lpips>=0.1.4",
    # raw ingest (user raws): rawpy wraps LibRaw for DNG/CR2/NEF -> RGB.
    "rawpy>=0.18",
    "webdataset>=0.2",
    "pillow>=10.0",
    "simplejpeg>=1.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "playwright>=1.40",
    "matplotlib>=3.8",
    # export pipeline: export, simplify, FP16 cast, ORT parity
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxsim>=0.4",
    "onnxscript>=0.6",
    "onnxconverter-common>=1.14",
    "lion-pytorch>=0.2.5",
    "schedulefree>=1.4.1",
]

[dependency-groups]
dev = [
    "pyiqa>=0.1.16",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dejpeg_train"]

# Standalone project (NOT a root workspace member): the root workspace pins
# CPU-only torch for fbcnn, which never touches CUDA. DeJPEGNet trains on GPU;
# PyPI manylinux wheels bundle CUDA via the nvidia-* deps, so no explicit
# pytorch index is needed.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
